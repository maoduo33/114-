<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌿114年台灣十大死因排序挑戰 🌿</title>
    <!-- 引入Google Fonts的可愛圓體字型 -->
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2e8b57;       /* 健康深綠 */
            --secondary-color: #3cb371;     /* 清新綠 */
            --accent-color: #48d1cc;        /* 馬卡龍湖水藍 */
            --success-color: #2ecc71;       /* 成功綠 */
            --bg-color: #f0f7f4;          /* 極淡馬卡龍綠背景 */
            --card-bg: #ffffff;
            --text-color: #2c3e50;
        }

        body {
            font-family: 'Zen Maru Gothic', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            /* 輕柔的清新網格背景 */
            background-image: radial-gradient(#d1e7dd 15%, transparent 16%), radial-gradient(#d1e7dd 15%, transparent 16%);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
        }

        .container {
            max-width: 820px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(46, 139, 87, 0.12);
            border: 4px solid #d1e7dd;
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 8px;
            font-size: 1.8rem;
            letter-spacing: 1px;
            text-shadow: 2px 2px 0px #e2f0d9;
        }

        .instructions {
            text-align: center;
            color: #4f6f52;
            margin-bottom: 25px;
            font-size: 1rem;
            background: #eaf4ed;
            padding: 10px 15px;
            border-radius: 12px;
            display: inline-block;
            width: 100%;
            box-sizing: border-box;
            border: 1px dashed #b8d8c2;
        }

        .game-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 600px) {
            .game-area {
                grid-template-columns: 1fr;
            }
        }

        .box {
            border: 3px dashed #a3d9bc;
            border-radius: 16px;
            padding: 15px;
            min-height: 400px;
            background: #fbfdfc;
        }

        .box h3 {
            margin-top: 0;
            font-size: 1.1rem;
            color: var(--primary-color);
            border-bottom: 2px dashed #d1e7dd;
            padding-bottom: 8px;
            text-align: center;
        }

        .item-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card {
            background: white;
            border: 2px solid #c8e6c9;
            padding: 12px 14px;
            border-radius: 12px;
            cursor: pointer;
            user-select: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-weight: 700;
            font-size: 0.95rem;
        }

        .card:hover {
            border-color: var(--secondary-color);
            background: #f1f8f5;
            transform: translateY(-2px) scale(1.01);
        }

        .ranked-card {
            background: #e0f2f1; /* 舒服的馬卡龍藍綠色 */
            border-color: #80cbc4;
        }
        
        .ranked-card:hover {
            background: #b2dfdb;
            border-color: var(--accent-color);
        }

        .rank-number {
            font-weight: 700;
            color: #00796b;
            margin-right: 10px;
            background: #b2dfdb;
            padding: 2px 8px;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .btn-controls {
            display: flex;
            gap: 6px;
        }

        .btn-controls button {
            background: white;
            border: 2px solid #80cbc4;
            border-radius: 8px;
            cursor: pointer;
            padding: 3px 8px;
            font-size: 0.8rem;
            font-weight: bold;
            color: #00796b;
            transition: all 0.2s;
        }

        .btn-controls button:hover {
            background: #00796b;
            color: white;
        }

        .action-panel {
            text-align: center;
            margin-top: 30px;
        }

        .btn-submit {
            background: linear-gradient(135deg, #2e8b57, #48d1cc);
            color: white;
            border: none;
            padding: 12px 35px;
            font-size: 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 700;
            box-shadow: 0 6px 20px rgba(46, 139, 87, 0.3);
            transition: all 0.2s;
            font-family: 'Zen Maru Gothic', sans-serif;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(46, 139, 87, 0.5);
        }

        #result-section {
            margin-top: 25px;
            display: none;
            animation: fadeIn 0.5s;
        }

        .result-card {
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 1.3rem;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .correct-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 14px;
            margin-bottom: 8px;
            border-radius: 10px;
            background: #f8f9fa;
            font-weight: 500;
            font-size: 0.95rem;
        }

        .correct-item.matched {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .correct-item.unmatched {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🌿 114年台灣十大死因排行榜 🌿</h1>
    <div class="instructions">💡 點擊左側疾病類別加入右側排序！隨時可以上下調整順序，挑戰看看吧！</div>

    <div class="game-area">
        <!-- 待選區 -->
        <div class="box">
            <h3>🌱 疾病類別</h3>
            <div id="pool-list" class="item-list"></div>
        </div>

        <!-- 排序區 -->
        <div class="box">
            <h3>🏆 你的預測順序 (1-10名)</h3>
            <div id="ranked-list" class="item-list"></div>
        </div>
    </div>

    <div class="action-panel">
        <button class="btn-submit" onclick="submitAnswers()">🚀 送出答案看成績！</button>
    </div>

    <div id="result-section">
        <div id="score-banner" class="result-card"></div>
        <h3>📖 正確解答公佈欄：</h3>
        <div id="correct-answer-list"></div>
        <div class="action-panel">
            <button class="btn-submit" style="background: linear-gradient(135deg, #3cb371, #20b2aa);" onclick="initGame()">🔄 再玩一次！</button>
        </div>
    </div>
</div>

<script>
    const correctOrder = [
        "惡性腫瘤（癌症）",
        "心臟疾病",
        "肺炎",
        "腦血管疾病",
        "糖尿病",
        "高血壓性疾病",
        "事故傷害",
        "腎炎、腎病症候群及腎病變",
        "慢性下呼吸道疾病",
        "蓄意自我傷害（自殺）"
    ];

    let poolItems = [];
    let rankedItems = [];

    function initGame() {
        poolItems = [...correctOrder].sort(() => Math.random() - 0.5);
        rankedItems = [];
        
        document.getElementById('result-section').style.display = 'none';
        document.querySelector('.action-panel').style.display = 'block';
        render();
    }

    function moveToRanked(item) {
        if (rankedItems.length >= 10) return;
        poolItems = poolItems.filter(i => i !== item);
        rankedItems.push(item);
        render();
    }

    function moveToPool(item) {
        rankedItems = rankedItems.filter(i => i !== item);
        poolItems.push(item);
        render();
    }

    function moveRank(index, direction) {
        const newIndex = index + direction;
        if (newIndex < 0 || newIndex >= rankedItems.length) return;
        
        const temp = rankedItems[index];
        rankedItems[index] = rankedItems[newIndex];
        rankedItems[newIndex] = temp;
        render();
    }

    function render() {
        const poolContainer = document.getElementById('pool-list');
        const rankedContainer = document.getElementById('ranked-list');

        poolContainer.innerHTML = '';
        rankedContainer.innerHTML = '';

        poolItems.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<span>🍃 ${item}</span>`;
            card.onclick = () => moveToRanked(item);
            poolContainer.appendChild(card);
        });

        rankedItems.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'card ranked-card';
            card.innerHTML = `
                <div>
                    <span class="rank-number">#${index + 1}</span>
                    <span>${item}</span>
                </div>
                <div class="btn-controls">
                    <button onclick="event.stopPropagation(); moveRank(${index}, -1)">▲</button>
                    <button onclick="event.stopPropagation(); moveRank(${index}, 1)">▼</button>
                    <button onclick="event.stopPropagation(); moveToPool('${item}')">✕</button>
                </div>
            `;
            rankedContainer.appendChild(card);
        });
    }

    function submitAnswers() {
        if (rankedItems.length < 10) {
            alert('記得要把 10 個名次都排滿才可以送出唷！💪');
            return;
        }

        let score = 0;
        let htmlContent = '';

        correctOrder.forEach((correctItem, index) => {
            const userItem = rankedItems[index];
            const isCorrect = userItem === correctItem;
            if (isCorrect) score += 10;

            htmlContent += `
                <div class="correct-item ${isCorrect ? 'matched' : 'unmatched'}">
                    <span><strong>第 ${index + 1} 名：</strong> ${correctItem}</span>
                    <span>${isCorrect ? '🌿 答對啦！' : `❌ 你選的是：${userItem}`}</span>
                </div>
            `;
        });

        const scoreBanner = document.getElementById('score-banner');
        scoreBanner.innerText = `🌟 測驗結果：${score} 分！ ${score === 100 ? '🎉 太神了吧！達人完全制霸！' : '🌱 很棒喔！再接再厲！'}`;
        scoreBanner.style.backgroundColor = score === 100 ? '#d4edda' : '#fff3cd';
        scoreBanner.style.color = score === 100 ? '#155724' : '#856404';

        document.getElementById('correct-answer-list').innerHTML = htmlContent;
        document.getElementById('result-section').style.display = 'block';
        document.querySelector('.action-panel').style.display = 'none';
        
        document.getElementById('result-section').scrollIntoView({ behavior: 'smooth' });
    }

    initGame();
</script>

</body>
</html>
